<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自然演繹 MVPテスト (∧, →)</title>
<style>
    body { font-family: sans-serif; background: #f4f7f6; margin: 0; display: flex; flex-direction: column; height: 100dvh; touch-action: none; overflow: hidden; }
    header { background: #2c3e50; color: white; padding: 10px; text-align: center; font-size: 14px; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    #canvas { flex: 1; position: relative; overflow: hidden; }
    #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    .node { position: absolute; padding: 10px 15px; background: #ecf0f1; border-radius: 5px; font-weight: bold; text-align: center; user-select: none; border: 2px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: box-shadow 0.2s, transform 0.2s; }
    .node.active { box-shadow: 0 10px 20px rgba(0,0,0,0.3); transform: scale(1.05); z-index: 100; }
    .node.error { border: 2px dashed #e74c3c; background-color: #fadbd8; }
    
    line { stroke: #333; stroke-width: 2; }
    
    /* モーダル・パレット共通スタイル */
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 200; text-align: center; min-width: 250px; }
    .btn { margin: 5px; padding: 10px; cursor: pointer; border: none; background: #2ecc71; color: white; border-radius: 5px; font-weight: bold; width: 80%; }
    .btn.cancel { background: #95a5a6; margin-top: 15px; }
    
    #palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .palette-card { padding: 15px 10px; background: #3498db; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    
    #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); z-index: 150; }
</style>
</head>
<body>

<header>
    お題: <b>A → B, A ⊢ A ∧ B</b><br>
    <small>空間をダブルタップで追加 / 長押しで移動 / フリックで合流</small>
</header>

<div id="canvas">
    <svg id="svg-layer"></svg>
</div>

<div id="overlay" onclick="closeAllModals()"></div>

<!-- 推論規則選択モーダル -->
<div id="rule-modal" class="modal">
    <h3>推論規則を選択</h3>
    <button class="btn" onclick="applyRule('impl_E')">→E (含意除去)</button>
    <button class="btn" onclick="applyRule('and_I')">∧I (連言導入)</button>
    <button class="btn cancel" onclick="closeAllModals()">キャンセル</button>
</div>

<!-- ダブルタップ用 論理式パレット -->
<div id="palette-modal" class="modal">
    <h3 style="margin: 0;">手持ちの論理式</h3>
    <div id="palette-grid">
        <div class="palette-card" onclick="spawnFromPalette('A')">A</div>
        <div class="palette-card" onclick="spawnFromPalette('B')">B</div>
        <div class="palette-card" onclick="spawnFromPalette('A → B')">A → B</div>
        <div class="palette-card" onclick="spawnFromPalette('A ∧ B')">A ∧ B</div>
    </div>
</div>

<script>
    // --- 1. AST（抽象構文木）ロジックエンジン ---
    function parseAST(str) {
        if (str.includes('∧')) {
            let [l, r] = str.split('∧').map(s => s.trim());
            return { op: '∧', left: parseAST(l), right: parseAST(r) };
        }
        if (str.includes('→')) {
            let [l, r] = str.split('→').map(s => s.trim());
            return { op: '→', left: parseAST(l), right: parseAST(r) };
        }
        return { op: 'atom', val: str.trim() };
    }

    function checkEqual(ast1, ast2) {
        return JSON.stringify(ast1) === JSON.stringify(ast2);
    }

    function validateRule(rule, sources, target) {
        let tgtAst = parseAST(target);
        let srcAsts = sources.map(parseAST);

        if (rule === 'impl_E') {
            if (srcAsts.length !== 2) return false;
            let impl = srcAsts.find(s => s.op === '→');
            let atom = srcAsts.find(s => s !== impl);
            if (!impl || !atom) return false;
            return checkEqual(impl.left, atom) && checkEqual(impl.right, tgtAst);
        }
        if (rule === 'and_I') {
            if (srcAsts.length !== 2) return false;
            if (tgtAst.op !== '∧') return false;
            return (checkEqual(srcAsts[0], tgtAst.left) && checkEqual(srcAsts[1], tgtAst.right)) ||
                   (checkEqual(srcAsts[1], tgtAst.left) && checkEqual(srcAsts[0], tgtAst.right));
        }
        return false;
    }


    // --- 2. UI・描画エンジン ---
    const canvas = document.getElementById('canvas');
    const svgLayer = document.getElementById('svg-layer');
    let nodes = [];
    let edges = [];
    let nodeIdCounter = 0;

    let activeNode = null;
    let isDrawing = false;
    let isMoving = false;
    let pressTimer = null;
    let tempLine = null;
    let startCoords = {x:0, y:0};
    
    let pendingConnection = null;
    
    // ダブルタップ検知用
    let lastTapTime = 0;
    let tapPosition = { x: 0, y: 0 };

    // --- 初期化処理 ---
    window.onload = () => {
        // 画面下部に初期状態の「結論」を配置する
        const startX = window.innerWidth / 2 - 35;
        const startY = window.innerHeight - 150; 
        spawn('A ∧ B', startX, startY);
    };

    // --- ダブルタップでパレットを開く ---
    canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.node')) return; // ノード上のタップは無視

        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;
        
        if (tapLength < 300 && tapLength > 0) {
            // スマホのズーム等を防ぎつつダブルタップを検知
            e.preventDefault();
            tapPosition = { x: e.clientX, y: e.clientY };
            document.getElementById('palette-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        lastTapTime = currentTime;
    });

    function spawnFromPalette(formula) {
        // タップした座標の少し上に生成する
        spawn(formula, tapPosition.x - 30, tapPosition.y - 20);
        closeAllModals();
    }

    function spawn(formula, x, y) {
        const id = 'node_' + (nodeIdCounter++);
        const el = document.createElement('div');
        el.className = 'node';
        el.innerText = formula;
        
        // 座標指定がない場合は中央付近にランダム
        if (x === undefined) x = window.innerWidth / 2 - 30 + (Math.random()*40 - 20);
        if (y === undefined) y = window.innerHeight / 2 - 80 + (Math.random()*40 - 20);
        
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        
        canvas.appendChild(el);
        const nodeObj = { id, el, formula, x, y };
        nodes.push(nodeObj);
        
        bindPointerEvents(nodeObj);
    }

    function getCenter(el) {
        const rect = el.getBoundingClientRect();
        return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
    }

    function bindPointerEvents(node) {
        node.el.addEventListener('pointerdown', (e) => {
            e.stopPropagation(); // キャンバスのダブルタップ誤爆を防ぐ
            activeNode = node;
            startCoords = { x: e.clientX, y: e.clientY };
            
            // 300ms経過したら「移動モード」になる
            pressTimer = setTimeout(() => {
                isMoving = true;
                node.el.classList.add('active');
            }, 300);
        });
    }

    document.addEventListener('pointermove', (e) => {
        if (!activeNode) return;

        // 指が大きく動いたら線引きモード
        const dist = Math.hypot(e.clientX - startCoords.x, e.clientY - startCoords.y);
        if (!isMoving && dist > 15) {
            clearTimeout(pressTimer);
            isDrawing = true;
        }

        if (isMoving) {
            const dx = e.clientX - startCoords.x;
            const dy = e.clientY - startCoords.y;
            activeNode.x += dx;
            activeNode.y += dy;
            activeNode.el.style.left = activeNode.x + 'px';
            activeNode.el.style.top = activeNode.y + 'px';
            startCoords = { x: e.clientX, y: e.clientY };
            updateEdges();
        } else if (isDrawing) {
            if (!tempLine) {
                tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                svgLayer.appendChild(tempLine);
            }
            const center = getCenter(activeNode.el);
            tempLine.setAttribute('x1', center.x);
            tempLine.setAttribute('y1', center.y);
            tempLine.setAttribute('x2', e.clientX);
            tempLine.setAttribute('y2', e.clientY);
        }
    });

    document.addEventListener('pointerup', (e) => {
        clearTimeout(pressTimer);
        
        if (isMoving) {
            activeNode.el.classList.remove('active');
        } else if (isDrawing) {
            // 合流判定
            const dropTarget = getElementUnderPointer(e.clientX, e.clientY);
            if (dropTarget && dropTarget !== activeNode.el) {
                const targetNode = nodes.find(n => n.el === dropTarget);
                pendingConnection = { source: activeNode, target: targetNode };
                document.getElementById('rule-modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            }
        }
        
        if (tempLine) {
            tempLine.remove();
            tempLine = null;
        }
        
        activeNode = null;
        isDrawing = false;
        isMoving = false;
    });

    function getElementUnderPointer(x, y) {
        const els = document.elementsFromPoint(x, y);
        return els.find(el => el.classList.contains('node'));
    }

    function applyRule(ruleName) {
        closeAllModals();
        if(!pendingConnection) return;
        
        const { source, target } = pendingConnection;
        
        let edge = edges.find(e => e.target === target);
        if (!edge) {
            edge = { sources: [source], target: target, rule: ruleName, lineEls: [] };
            edges.push(edge);
        } else {
            edge.sources.push(source);
            edge.rule = ruleName;
        }
        
        const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        svgLayer.appendChild(lineEl);
        edge.lineEls.push(lineEl);
        
        const sourceFormulas = edge.sources.map(n => n.formula);
        const isValid = validateRule(ruleName, sourceFormulas, target.formula);
        
        if (!isValid) {
            target.el.classList.add('error');
        } else {
            target.el.classList.remove('error');
        }
        
        pendingConnection = null;
        updateEdges();
    }

    function closeAllModals() {
        document.getElementById('rule-modal').style.display = 'none';
        document.getElementById('palette-modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
        pendingConnection = null;
    }

    function updateEdges() {
        edges.forEach(edge => {
            const tCenter = getCenter(edge.target.el);
            edge.sources.forEach((src, idx) => {
                const sCenter = getCenter(src.el);
                const line = edge.lineEls[idx];
                line.setAttribute('x1', sCenter.x);
                line.setAttribute('y1', sCenter.y);
                line.setAttribute('x2', tCenter.x);
                line.setAttribute('y2', tCenter.y);
            });
        });
    }
</script>

</body>
</html>
