<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然演繹パズル プロトタイプ</title>
<style>
    body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; }
    #canvas { flex: 1; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 100px; overflow: auto; }
    #deck-area { background-color: #fff; border-top: 2px solid #ddd; padding: 20px; display: flex; gap: 15px; align-items: center; justify-content: center; min-height: 80px; }
    
    /* 証明木のスタイル */
    .tree-node { display: flex; flex-direction: column; align-items: center; margin: 0 10px; }
    .children { display: flex; flex-direction: row; align-items: flex-end; gap: 20px; margin-bottom: 5px; }
    .inference-line { border-top: 2px solid #333; width: 100%; text-align: center; position: relative; margin-top: 5px; padding-top: 5px; }
    .rule-label { position: absolute; right: -35px; top: -10px; font-size: 14px; font-weight: bold; color: #e74c3c; }
    
    /* 論理式要素のスタイル */
    .formula { padding: 8px 15px; background-color: #ecf0f1; border-radius: 5px; cursor: pointer; border: 2px solid transparent; font-size: 18px; font-weight: bold; transition: 0.2s; }
    .formula:hover { border-color: #3498db; background-color: #d6eaf8; }
    .formula.empty { background-color: #fff; border: 2px dashed #95a5a6; color: #95a5a6; }
    
    /* デッキのカード */
    .card { padding: 10px 20px; background-color: #3498db; color: white; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
    .card:hover { transform: translateY(-2px); background-color: #2980b9; }
    .card.assumption { background-color: #f39c12; animation: pop 0.5s ease-out; }
    
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* パネル */
    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; text-align: center; }
    .btn { margin: 5px; padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; background-color: #2ecc71; color: white; border-radius: 5px; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; }
</style>
</head>
<body>

<header>
    <h2>証明ミッション: A ⊢ ¬¬A を証明せよ</h2>
    <p>数式をクリック（タップ）して推論規則や配置するカードを選んでください。</p>
</header>

<div id="canvas">
    <!-- ここに証明図が描画されます -->
</div>

<div id="deck-area">
    <div style="margin-right: 20px; font-weight: bold; color: #7f8c8d;">手持ちのデッキ:</div>
    <div id="deck"></div>
</div>

<!-- モーダルUI -->
<div class="overlay" id="overlay"></div>
<div id="modal">
    <h3 id="modal-title">推論規則を選択</h3>
    <div id="modal-content"></div>
</div>

<script>
    // 状態管理（簡易的なステートマシン）
    let step = 0;

    const canvas = document.getElementById('canvas');
    const deck = document.getElementById('deck');
    const modal = document.getElementById('modal');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('modal-content');

    function render() {
        if (step === 0) {
            canvas.innerHTML = `
                <div class="tree-node">
                    <div class="formula" onclick="openRuleModal('not_I')">¬¬A</div>
                </div>
            `;
            deck.innerHTML = `<div class="card">A</div>`;
        } 
        else if (step === 1) {
            canvas.innerHTML = `
                <div class="tree-node">
                    <div class="children">
                        <div class="tree-node">
                            <div class="formula" onclick="openRuleModal('not_E')">⊥</div>
                        </div>
                    </div>
                    <div class="inference-line">
                        <div class="rule-label">¬I<sub>1</sub></div>
                        <div class="formula">¬¬A</div>
                    </div>
                </div>
            `;
            deck.innerHTML = `
                <div class="card">A</div>
                <div class="card assumption">[¬A]<sup>1</sup></div>
            `;
        }
        else if (step === 2) {
            canvas.innerHTML = `
                <div class="tree-node">
                    <div class="children">
                        <div class="tree-node">
                            <div class="formula empty" onclick="placeCard('left')">[ ? ]</div>
                        </div>
                        <div class="tree-node">
                            <div class="formula empty" onclick="placeCard('right')">[ ? ]</div>
                        </div>
                    </div>
                    <div class="inference-line">
                        <div class="rule-label">¬E</div>
                        <div class="formula">⊥</div>
                    </div>
                    <div class="inference-line">
                        <div class="rule-label">¬I<sub>1</sub></div>
                        <div class="formula">¬¬A</div>
                    </div>
                </div>
            `;
        }
        else if (step === 3) {
            canvas.innerHTML = canvas.innerHTML.replace(`<div class="formula empty" onclick="placeCard('left')">[ ? ]</div>`, `<div class="formula">A</div>`);
        }
        else if (step === 4) {
            canvas.innerHTML = canvas.innerHTML.replace(`<div class="formula empty" onclick="placeCard('right')">[ ? ]</div>`, `<div class="formula">[¬A]<sup>1</sup></div>`);
            setTimeout(() => {
                alert("🎉 証明クリア！見事 A ⊢ ¬¬A を証明しました！");
            }, 100);
        }
    }

    function openRuleModal(expectedRule) {
        modal.style.display = 'block';
        overlay.style.display = 'block';
        modalTitle.innerText = "推論規則を選択（上フリック）";
        modalContent.innerHTML = `
            <button class="btn" onclick="applyRule('${expectedRule}', 'not_I')">¬I (否定導入)</button>
            <button class="btn" style="background:#95a5a6;" onclick="alert('この段階では使えません')">→I</button>
            <button class="btn" onclick="applyRule('${expectedRule}', 'not_E')">¬E (否定除去)</button>
        `;
    }

    function applyRule(expected, selected) {
        if (expected === selected) {
            step++;
            closeModal();
            render();
        } else {
            alert("この論理式にその規則は適用できません。");
        }
    }

    function placeCard(position) {
        modal.style.display = 'block';
        overlay.style.display = 'block';
        modalTitle.innerText = "マスに置くカードを選択";
        
        let html = '';
        if (position === 'left' && step === 2) {
            html += `<button class="btn" onclick="confirmCard('left')">A</button>`;
        } else if (position === 'right' && step === 3) {
            html += `<button class="btn assumption" onclick="confirmCard('right')">[¬A]¹</button>`;
        } else {
            html += `<p style="color:red;">今は正しいカードが選べません</p>`;
        }
        modalContent.innerHTML = html;
    }

    function confirmCard(position) {
        step++;
        closeModal();
        render();
    }

    function closeModal() {
        modal.style.display = 'none';
        overlay.style.display = 'none';
    }

    // 初期描画
    render();
</script>

</body>
</html>
