<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然演繹パズル プロトタイプ v2</title>
<style>
    body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; }
    #canvas { flex: 1; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; overflow: auto; }
    #deck-area { background-color: #fff; border-top: 2px solid #ddd; padding: 20px; display: flex; gap: 15px; align-items: center; justify-content: center; min-height: 80px; }
    
    /* 証明木のスタイル */
    .tree-node { display: flex; flex-direction: column; align-items: center; margin: 0 10px; }
    .children { display: flex; flex-direction: row; align-items: flex-end; gap: 20px; margin-bottom: 5px; }
    .inference-line { border-top: 2px solid #333; width: 100%; text-align: center; position: relative; margin-top: 5px; padding-top: 5px; }
    .rule-label { position: absolute; right: -35px; top: -10px; font-size: 14px; font-weight: bold; color: #e74c3c; }
    
    /* 論理式要素のスタイル */
    .formula { padding: 8px 15px; background-color: #ecf0f1; border-radius: 5px; cursor: pointer; border: 2px solid transparent; font-size: 18px; font-weight: bold; transition: 0.2s; }
    .formula:hover { border-color: #3498db; background-color: #d6eaf8; }
    .formula.empty { background-color: #fff; border: 2px dashed #95a5a6; color: #95a5a6; }
    
    /* デッキのカード */
    .card { padding: 10px 20px; background-color: #3498db; color: white; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
    .card:hover { transform: translateY(-2px); background-color: #2980b9; }
    .card.assumption { background-color: #f39c12; animation: pop 0.5s ease-out; }
    
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* パネル */
    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; text-align: center; }
    .btn { margin: 5px; padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; background-color: #2ecc71; color: white; border-radius: 5px; }
    .btn.cancel { background-color: #e74c3c; margin-top: 15px; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; }
</style>
</head>
<body>

<header>
    <h2>証明ミッション: A ⊢ ¬¬A</h2>
    <p>数式をタップして推論を進めるか、デッキのカードをタップして盤面に配置してください。</p>
</header>

<div id="canvas"></div>

<div id="deck-area">
    <div style="margin-right: 20px; font-weight: bold; color: #7f8c8d;">手持ちのデッキ:</div>
    <div id="deck"></div>
</div>

<!-- モーダルUI (背景のoverlayにonclickを追加して閉じるように設定) -->
<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="modal">
    <h3 id="modal-title">操作を選択</h3>
    <div id="modal-content"></div>
</div>

<script>
    let step = 0; // 0:初期状態, 10~:前進計算ルート

    const canvas = document.getElementById('canvas');
    const deck = document.getElementById('deck');
    const modal = document.getElementById('modal');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('modal-content');

    function render() {
        if (step === 0) {
            canvas.innerHTML = `
                <div class="tree-node">
                    <div style="font-size:12px; color:#95a5a6; margin-bottom:5px;">最終目標 (タップで逆算)</div>
                    <div class="formula empty" onclick="alert('今回は前進計算（デッキからの操作）を試してください！')">¬¬A</div>
                </div>
            `;
            deck.innerHTML = `<div class="card" onclick="forwardStep(10)">A</div>`;
        } 
        else if (step === 10) {
            canvas.innerHTML = `
                <div class="tree-node">
                    <div class="formula" onclick="openRuleModal('forward_A')">A</div>
                </div>
            `;
            deck.innerHTML = `<div class="card assumption" onclick="forwardStep(11)">[¬A] (仮定)</div>`;
        }
        else if (step === 11) {
            canvas.innerHTML = `
                <div class="children">
                    <div class="tree-node">
                        <div class="formula" onclick="openRuleModal('forward_join')">A</div>
                    </div>
                    <div class="tree-node">
                        <div class="formula" onclick="openRuleModal('forward_join')">[¬A]</div>
                    </div>
                </div>
            `;
            deck.innerHTML = ``;
        }
        else if (step === 12) {
            canvas.innerHTML = `
                <div class="tree-node">
                    <div class="children">
                        <div class="tree-node"><div class="formula">A</div></div>
                        <div class="tree-node"><div class="formula">[¬A]</div></div>
                    </div>
                    <div class="inference-line">
                        <div class="rule-label">¬E</div>
                        <div class="formula" onclick="openRuleModal('forward_bot')">⊥</div>
                    </div>
                </div>
            `;
        }
        else if (step === 13) {
            canvas.innerHTML = `
                <div class="tree-node">
                    <div class="children">
                        <div class="tree-node">
                            <div class="children">
                                <div class="tree-node"><div class="formula">A</div></div>
                                <div class="tree-node"><div class="formula">[¬A]<sup>1</sup></div></div>
                            </div>
                            <div class="inference-line">
                                <div class="rule-label">¬E</div>
                                <div class="formula">⊥</div>
                            </div>
                        </div>
                    </div>
                    <div class="inference-line">
                        <div class="rule-label">¬I<sub>1</sub></div>
                        <div class="formula">¬¬A</div>
                    </div>
                </div>
            `;
            setTimeout(() => alert("🎉 証明クリア！前進計算で見事 A ⊢ ¬¬A を証明しました！"), 100);
        }
    }

    function forwardStep(nextStep) {
        step = nextStep;
        render();
    }

    function openRuleModal(actionType) {
        modal.style.display = 'block';
        overlay.style.display = 'block';
        modalTitle.innerText = "推論規則を選択 (下フリック)";
        
        let html = '';
        if (actionType === 'forward_A') {
            html += `<p style="font-size:14px; color:#7f8c8d;">※A単体で使える規則はありません。<br>デッキから仮定を追加してください。</p>`;
        } else if (actionType === 'forward_join') {
            html += `<button class="btn" onclick="applyRule('forward_join', 'not_E')">¬E (否定除去) で合流</button>`;
        } else if (actionType === 'forward_bot') {
            html += `<button class="btn" onclick="applyRule('forward_bot', 'not_I')">¬I (否定導入)</button>`;
        }
        
        html += `<br><button class="btn cancel" onclick="closeModal()">キャンセル</button>`;
        modalContent.innerHTML = html;
    }

    function applyRule(expectedType, selectedRule) {
        if (expectedType === 'forward_join' && selectedRule === 'not_E') {
            step = 12;
            closeModal();
            render();
        } else if (expectedType === 'forward_bot' && selectedRule === 'not_I') {
            step = 13;
            closeModal();
            render();
        } else {
            alert("その規則は適用できません。");
        }
    }

    function closeModal() {
        modal.style.display = 'none';
        overlay.style.display = 'none';
    }

    render();
</script>

</body>
</html>
